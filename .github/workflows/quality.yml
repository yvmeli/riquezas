name: OWL quality
on:
  push:
    branches: [mvp]
  pull_request:
    branches: [mvp]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: pip install -r apps/api/requirements.lock
      - run: pip install --no-deps -e apps/api
      - run: python -m pytest apps/api -q
      - run: npm run test:db
      - run: npm run test:money
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: python -m uvicorn owl.main:app --host 127.0.0.1 --port 8000 > /tmp/owl-api.log 2>&1 &
      - run: npm run test:e2e

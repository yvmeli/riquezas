<h1>Accede a OWL</h1>
<p>Tu código de acceso es:</p>
<strong>{{ .Token }}</strong>
<p>Vence en 10 minutos. Si recibiste una invitación, abre el enlace y confirma el acceso:</p>
<p><a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}">Continuar en OWL</a></p>
<p>Si no solicitaste este correo, ignóralo.</p>
